name: Proofd
options:
  bundleIdPrefix: com.duolaameng
  deploymentTarget:
    iOS: "17.0"
targets:
  Proofd:
    type: application
    platform: iOS
    sources:
      - Resources/Proofd.storekit
      - Resources/PrivacyInfo.xcprivacy
      - Sources
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duolaameng.proofd
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Proofd uses the camera to diagnose your sourdough starter and crumb."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Add photos of your starter or bakes from your library to diagnose them."
        INFOPLIST_KEY_UIUserInterfaceStyleName: Light
    scheme:
      storeKitConfiguration: Resources/Proofd.storekit
    info:
      path: Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Light
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Proofd uses the camera to diagnose your sourdough starter and crumb."
        NSPhotoLibraryUsageDescription: "Add photos of your starter or bakes from your library to diagnose them."
